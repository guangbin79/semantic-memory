[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-mcp"
version = "0.1.0"
description = "Context-relevance sidecar for coding agents: model-semantic-level context retrieval (BM25 + vector + RRF) for opencode v2, with a thin v2 plugin for automatic recall/capture"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastmcp>=2.3",
    "numpy>=1.26",
]

[project.optional-dependencies]
# 向量嵌入：Qwen3-Embedding-0.6B GGUF，缺省时自动降级为纯 BM25。
# 版本与 ctx-semantic 锁定的 llama-cpp-python 0.3.35 对齐（同一模型同一向量）。
embed = ["llama-cpp-python==0.3.35"]
dev = ["pytest>=8"]

[project.scripts]
memory-mcp = "memory_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
