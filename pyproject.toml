[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-memory"
version = "1.0.0"
description = "Context-relevance sidecar for coding agents: model-semantic-level context retrieval (BM25 + vector + RRF) for opencode v2, with a thin v2 plugin for automatic recall/capture"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# 零依赖基座：裸 python3 可跑（BM25-only + install_hint 自解释）；向量腿见 extras
dependencies = []

[project.optional-dependencies]
# 向量腿：Qwen3-Embedding-0.6B GGUF，缺 numpy 时自动降级为纯 BM25（_compat 守门）。
# 版本与 ctx-semantic 锁定的 llama-cpp-python 0.3.35 对齐（同一模型同一向量）。
vector = ["numpy>=1.26"]
embed = ["numpy>=1.26", "llama-cpp-python==0.3.35"]
dev = ["pytest>=8", "numpy>=1.26", "httpx>=0.27"]  # dev 必含 numpy+httpx：全套件默认全跑（cloud/setup 走 httpx2→httpx 回退）

[project.scripts]
semantic-memory = "semantic_memory.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
