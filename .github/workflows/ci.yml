name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    env:
      MEMORY_DB_PATH: /tmp/ci-eval.db
      MEMORY_DEVICE: cpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: eval smoke + optional recall gate
        # 样例 golden 只冒烟（无门槛）；真实门禁：仓库 secret/变量注入
        # MEMORY_GOLDEN（golden jsonl 路径或生成自遥测的文件）+ MEMORY_MIN_RECALL（如 5:0.8）
        run: |
          semantic-memory eval --golden tests/fixtures/golden.sample.jsonl --k 1,3,5
          if [ -n "$MEMORY_GOLDEN" ]; then
            semantic-memory eval --golden "$MEMORY_GOLDEN" --min-recall "${MEMORY_MIN_RECALL:-5:0.8}"
          fi
