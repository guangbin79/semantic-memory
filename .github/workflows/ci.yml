name: ci
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: eval smoke + optional recall gate
        # 样例 golden 只冒烟（无门槛）；真实门禁：仓库 Variables 配
        # MEMORY_GOLDEN（runner 上可达的 golden jsonl 路径）+ MEMORY_MIN_RECALL（如 5:0.8）
        # 用 vars 而非 secrets：fork PR 拿不到 secrets（门禁会静默跳过——可接受）
        env:
          MEMORY_GOLDEN: ${{ vars.MEMORY_GOLDEN }}
          MEMORY_MIN_RECALL: ${{ vars.MEMORY_MIN_RECALL }}
          MEMORY_DB_PATH: /tmp/ci-eval.db
          MEMORY_DEVICE: cpu
        run: |
          semantic-memory eval --golden tests/fixtures/golden.sample.jsonl --k 1,3,5
          if [ -n "$MEMORY_GOLDEN" ]; then
            semantic-memory eval --golden "$MEMORY_GOLDEN" --min-recall "${MEMORY_MIN_RECALL:-5:0.8}"
          fi
